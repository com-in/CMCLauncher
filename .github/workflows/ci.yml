name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run native tests
        run: dotnet run --project native.tests/CMCLauncher.Tests.csproj -c Release

  # 原生测试通过后再构建发行包，避免把已知失败的核心代码打包。
  build:
    name: Build Windows release
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # 仅标签发行构建从 Actions secret 写入公开客户端 ID，普通 PR 构建不读取它。
      - name: Configure Microsoft login for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MICROSOFT_CLIENT_ID)) { throw 'Set the MICROSOFT_CLIENT_ID GitHub Actions secret before publishing a tagged release.' }
          @{ clientId = $env:MICROSOFT_CLIENT_ID } | ConvertTo-Json | Set-Content -LiteralPath winui/clientid.local.json -Encoding utf8
      - name: Publish self-contained WinUI app
        run: dotnet publish winui/CMCLauncher.WinUI.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o dist/cmc-launcher
      - name: Package and scan release archive
        shell: pwsh
        run: ./scripts/package-release.ps1 -PublishDirectory dist/cmc-launcher -ArchivePath dist/CMCLauncher-0.9.3-beta-win-x64.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMCLauncher-0.9.3-beta-win-x64
          path: dist/CMCLauncher-0.9.3-beta-win-x64.zip
          if-no-files-found: error
  # 发布任务只处理标签，复用上一步已打包并检查过的 ZIP。
  release:
    name: Publish tagged release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CMCLauncher-0.9.3-beta-win-x64
          path: release-files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-files/CMCLauncher-0.9.3-beta-win-x64.zip
