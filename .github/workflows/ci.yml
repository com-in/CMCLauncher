name: CI

on:
  push:
    branches: [main]
    tags: ['CMCL-v*', 'v*', '[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run native tests
        run: dotnet run --project native.tests/CMCLauncher.Tests.csproj -c Release

  # 原生测试通过后再构建发行包，避免把已知失败的核心代码打包。
  build:
    name: Build Windows release
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # 仅标签发行构建从 Actions secret 写入公开客户端 ID，普通 PR 构建不读取它。
      - name: Configure Microsoft login for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MICROSOFT_CLIENT_ID)) { throw 'Set the MICROSOFT_CLIENT_ID GitHub Actions secret before publishing a tagged release.' }
          @{ clientId = $env:MICROSOFT_CLIENT_ID } | ConvertTo-Json | Set-Content -LiteralPath winui/clientid.local.json -Encoding utf8
      - name: Configure CurseForge API key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./scripts/configure-curseforge.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'curseforge-api.json')
      - name: Publish self-contained WinUI app
        shell: pwsh
        run: dotnet publish winui/CMCLauncher.WinUI.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true "-p:CurseForgeConfigurationFile=$env:RUNNER_TEMP/curseforge-api.json" -o dist/cmc-launcher
      - name: Remove temporary CurseForge configuration
        if: always()
        shell: pwsh
        run: |
          $configuration = Join-Path $env:RUNNER_TEMP 'curseforge-api.json'
          if (Test-Path -LiteralPath $configuration) {
            Remove-Item -LiteralPath $configuration -Force
          }
      - name: Package and scan release archive
        shell: pwsh
        run: ./scripts/package-release.ps1 -PublishDirectory dist/cmc-launcher -ArchivePath dist/CMCLauncher-win-x64.zip
      - name: Check CurseForge credential exposure
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./scripts/verify-curseforge-secrets.ps1 -ArchivePath dist/CMCLauncher-win-x64.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/CMCLauncher-win-x64.zip
          # Upload the scanned ZIP directly instead of wrapping it in another archive.
          archive: false
          if-no-files-found: error
  # 发布任务只处理标签，复用上一步已打包并检查过的 ZIP。
  release:
    name: Publish tagged release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: CMCLauncher-win-x64.zip
          path: release-files
          # Preserve the already packaged ZIP instead of extracting its application files.
          skip-decompress: true
      # Only release assets receive a version; workflow artifacts keep a stable name.
      - name: Name release archive
        id: archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^(?:CMCL-)?v?(?<version>\d+\.\d+\.\d+)(?:-(?<channel>release|beta|alpha)(?<revision>(?:[.-]\d+)?))?$') {
            throw "Unsupported release tag: $env:RELEASE_TAG"
          }
          $version = $Matches['version']
          $channel = $Matches['channel']
          $revision = $Matches['revision']
          $prerelease = $channel -in @('beta', 'alpha')
          $suffix = if ($prerelease) { "-$channel$revision" } else { '' }
          $archivePath = "release-files/CMCLauncher-$version$suffix-win-x64.zip"
          Move-Item -LiteralPath release-files/CMCLauncher-win-x64.zip -Destination $archivePath
          "path=$archivePath" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ steps.archive.outputs.prerelease == 'true' }}
          files: ${{ steps.archive.outputs.path }}
