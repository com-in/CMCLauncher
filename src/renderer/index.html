<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.modrinth.com data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Craft Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar"><span class="titlemark"></span> CRAFT LAUNCHER <span class="build">EARLY ACCESS / 0.2.0</span></div>
  <aside class="sidebar">
    <div class="brand"><div class="brand-cube">C</div><div>craft<span>你的世界，由此开始。</span></div></div>
    <div class="nav-label">工作空间</div>
    <nav id="navigation">
      <button data-page="home" class="nav active"><span>⌂</span>开始游戏<i>01</i></button>
      <button data-page="instances" class="nav"><span>▦</span>我的实例<i id="instance-count">0</i></button>
      <button data-page="discover" class="nav"><span>◈</span>探索内容</button>
      <button data-page="mods" class="nav"><span>◇</span>Mod 管理</button>
    </nav>
    <button data-page="content" class="nav"><span>▤</span>资源与内容包</button><div class="nav-label lower">偏好与工具</div>
    <nav>
      <button data-page="accounts" class="nav"><span>◎</span>账号管理</button>
      <button data-page="logs" class="nav"><span>≡</span>运行日志</button>
      <button data-page="settings" class="nav"><span>⚙</span>启动器设置</button>
    </nav>
    <div class="sidebar-bottom"><div class="independent"><span class="status-dot"></span> 独立 · 开放 · 为探索而生</div><button id="account-shortcut" class="profile"><div class="avatar">?</div><div><strong id="profile-name">还未添加账号</strong><small id="profile-type">点击设置你的玩家身份</small></div><span>↗</span></button></div>
  </aside>
  <main id="main"><div class="loading">正在整理你的工作空间…</div></main>
  <footer class="statusbar"><span><span class="status-dot"></span> <span id="status-text">就绪，准备出发。</span></span><button id="folder-shortcut">打开游戏目录 ↗</button></footer>
  <div id="task" class="task hidden"><div><strong id="task-title"></strong><span id="task-value"></span></div><progress id="task-progress"></progress><small id="task-detail"></small></div>
  <div id="toast" role="status" class="toast hidden"></div>
  <dialog id="dialog"><div id="dialog-body"></div><button class="dialog-close" id="dialog-close" aria-label="关闭">×</button></dialog>
  <script src="app.js"></script>
</body>
</html>
